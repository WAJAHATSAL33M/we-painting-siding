<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#dce1e5;font:14px Arial}header{position:sticky;top:0;z-index:5;padding:12px;display:flex;gap:12px;justify-content:center;background:#0b2538;color:white}button{padding:10px 16px;border:1px solid #a9c0d1;border-radius:4px;cursor:pointer;background:white;color:#06243b}button[aria-pressed=true]{background:#0075b9;color:white}main{padding:20px 0;overflow:auto;text-align:center}iframe{display:block;margin:auto;border:0;background:#fff;width:1280px;height:800px}</style></head><body><header><button data-width="1280" aria-pressed="true">Desktop 1280</button><button data-width="768" aria-pressed="false">Tablet 768</button><button data-width="390" aria-pressed="false">Mobile 390</button><button data-width="360" aria-pressed="false">Small mobile 360</button></header><main><iframe src="/" title="Homepage viewport preview"></iframe></main><script>const f=document.querySelector('iframe');function size(){try{f.style.height=f.contentDocument.documentElement.scrollHeight+'px'}catch{}}f.onload=()=>{new ResizeObserver(size).observe(f.contentDocument.body);f.contentDocument.addEventListener('load',size,true);size()};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));requestAnimationFrame(size)})</script></body></html>
