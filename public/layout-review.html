<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive layout review</title><style>body{margin:16px;font:14px Arial;background:#f1f5f8;color:#071f32}button{padding:12px;margin:8px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #888;background:white}#result{max-width:1100px}label{display:inline-block;margin-right:12px}</style><h1>Responsive layout review</h1><label>Category <select id="group"><option value="interior">Interior</option><option value="exterior">Exterior</option></select></label><button id="run">Run viewport checks</button><button id="phone">Show phone</button><button id="desktop">Show desktop</button><p id="status" role="status">Ready</p><pre id="result"></pre><iframe id="frame" title="Page under review" width="375" height="820"></iframe><script>
const frame=document.querySelector('#frame'),status=document.querySelector('#status'),result=document.querySelector('#result');let failures=[],checks=[];
const interior=['/interior-painting/basement-painting','/cabinet-painting','/interior-painting/trim-painting','/interior-painting/door-painting','/interior-painting/wall-painting','/interior-painting/ceiling-painting'];
const exterior=['spray-painting','aluminum-painting','siding-painting','vinyl-siding-painting','brick-painting','exterior-stucco-painting','wood-siding-painting','eavestrough-fascia-painting','exterior-window-door-painting','commercial-painting'].map(s=>'/exterior-painting/'+s);
function load(path,width){return new Promise(resolve=>{frame.style.width=width+'px';frame.width=width;frame.onload=()=>requestAnimationFrame(()=>requestAnimationFrame(resolve));frame.src=path})}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;failures=[];checks=[];for(const path of (document.querySelector('#group').value==='interior'?interior:exterior)){for(const width of [320,375,768,1024,1440]){status.textContent='Checking '+path+' at '+width+'px';await load(path,width);const doc=frame.contentDocument,viewport=doc.documentElement.clientWidth;const overflowing=[...doc.querySelectorAll('main *,.wps-header *,.wps-footer *')].filter(el=>{const c=frame.contentWindow.getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0&&(r.right>viewport+2||r.left< -2)&&!el.closest('.ah-honeypot,.ah-skip')}).map(el=>el.tagName+'.'+el.className).slice(0,12);const horizontal=doc.documentElement.scrollWidth>viewport+2;const clipped=[...doc.querySelectorAll('main :is(h1,h2,h3,p,label,summary)')].filter(el=>el.clientWidth>0&&el.scrollWidth>el.clientWidth+2&&frame.contentWindow.getComputedStyle(el).overflowX!=='visible').map(el=>el.tagName+'.'+el.className);const check={path,width,viewport,horizontal,overflowing,clipped};checks.push(check);if(horizontal||overflowing.length||clipped.length)failures.push(check);result.textContent=JSON.stringify({completed:checks.length,failures},null,2)}}status.textContent='Complete: '+checks.length+' checks; '+failures.length+' failures';document.querySelector('#run').disabled=false};
document.querySelector('#phone').onclick=()=>load('/interior-painting/wall-painting',375);document.querySelector('#desktop').onclick=()=>load('/interior-painting/wall-painting',1440);
</script></html>
